name: SamsungTVRemote
options:
  bundleIdPrefix: com.indigital
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  SamsungTVRemote:
    build:
      targets:
        SamsungTVRemote: all
    test:
      targets:
        - RemoteConnectionTests

targets:
  SamsungTVRemote:
    type: application
    platform: macOS
    sources:
      - Sources/Shared
      - Sources/App
    info:
      path: Config/SamsungTVRemote-Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Connect to your Samsung TV on your home network to pair and send remote commands.
    entitlements:
      path: Config/SamsungTVRemote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indigital.samsungtvremote
        PRODUCT_NAME: Samsung TV Remote
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 43S9G46H25
        ENABLE_HARDENED_RUNTIME: YES

  RemoteConnectionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Shared/PersistentRemoteConnection.swift
      - Sources/Shared/TVNumberPadNavigation.swift
      - Sources/Shared/SamsungRemoteKey.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.indigital.samsungtvremote.connectiontests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 43S9G46H25
